spring:
  datasource:
    url: jdbc:tc:postgresql:16:///oims_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret-key: test-secret-key-for-testing-only-very-long-enough
      expiration-ms: 3600000
    api-keys:
      shopee: test-shopee-api-key
      tiktok: test-tiktok-api-key