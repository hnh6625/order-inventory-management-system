spring:
  datasource:
    url: jdbc:tc:postgresql:16:///oims_test  # Testcontainers tự tạo DB
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop  # tạo schema mới mỗi lần test
  flyway:
    enabled: true
    locations: classpath:db/migration